services:
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: abhyas-dev-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
