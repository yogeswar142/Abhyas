services:
  # 1. Backend Service (Hono Node Server)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abhyas-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - NODE_ENV=development

  # 2. Frontend Service (Next.js Web App - Depends on Backend)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: abhyas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000

  # 3. Package Service (Local Ollama Bridge - Depends on Frontend)
  bridge:
    build:
      context: ./packages/abhyas
      dockerfile: Dockerfile
    container_name: abhyas-bridge
    restart: unless-stopped
    ports:
      - "11435:11435"
    depends_on:
      frontend:
        condition: service_started
    environment:
      - ABHYAS_PORT=11435
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
